<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141b">
  <title>Dharm</title>
  <style>
    :root {
      --bg: #10141b;
      --elev: #171d27;
      --line: #2c3646;
      --text: #e8edf4;
      --muted: #93a0b3;
      --user: #1b2636;
      --focus: #9ec1ff;
      --ok: #9dccb2;
      --warn: #e3c48a;
      --danger: #f0a8a8;
      --width: 40rem;
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --reading: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color-scheme: dark;
    }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .name { font-weight: 650; letter-spacing: -0.03em; font-size: 1.05rem; }
    #status { color: var(--muted); font-size: 0.78rem; }
    #status[data-state="live"] { color: var(--ok); }
    #status[data-state="sources"] { color: var(--warn); }
    #status[data-state="down"] { color: var(--danger); }
    button, summary { font: inherit; color: inherit; }
    .text-btn, .send, .stop, .retry, .sources-toggle, .passage-toggle {
      min-height: 44px; border-radius: 10px; cursor: pointer;
    }
    .text-btn {
      background: transparent; border: 1px solid var(--line); padding: 0 14px; flex-shrink: 0;
    }
    .text-btn:hover { border-color: #4d5d74; }
    #thread { flex: 1; overflow-y: auto; padding: 28px 16px 8px; }
    .column { width: min(100%, var(--width)); margin: 0 auto; }
    .welcome h1 {
      margin: 0; font-family: var(--reading); font-weight: 560; font-size: 1.85rem;
      letter-spacing: -0.03em; line-height: 1.2;
    }
    .welcome p { margin: 10px 0 0; color: var(--muted); line-height: 1.5; max-width: 36rem; }
    .msg { margin-top: 22px; }
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .body {
      max-width: min(100%, 34rem); background: var(--user);
      border-radius: 16px 16px 6px 16px; padding: 10px 14px; line-height: 1.45;
    }
    .msg.assistant .body {
      font-family: var(--reading); font-size: 1.06rem; line-height: 1.58;
      overflow-wrap: anywhere;
    }
    .msg.assistant .body p { margin: 0 0 0.75em; }
    .msg.assistant .body p:last-child { margin-bottom: 0; }
    .msg.assistant .body ul, .msg.assistant .body ol { margin: 0.4em 0 0.8em; padding-left: 1.2em; }
    .msg.assistant .body li { margin: 0.2em 0; }
    .msg.assistant .body code, .msg.user code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em;
      background: rgba(255,255,255,0.06); padding: 0.05em 0.3em; border-radius: 4px;
    }
    .msg.assistant pre {
      overflow-x: auto; background: #0c1016; border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px;
    }
    .msg.assistant a { color: var(--focus); }
    .pending { color: var(--muted); font-family: var(--ui); font-size: 0.92rem; }
    .stopped { color: var(--muted); font-family: var(--ui); font-size: 0.85rem; }
    .sources { margin-top: 12px; }
    .sources-toggle, .passage-toggle {
      background: transparent; border: 0; padding: 0 2px; text-align: left; color: var(--focus);
    }
    .sources-toggle { font-size: 0.92rem; }
    .source-group { margin: 8px 0 0; }
    .source-group h3 {
      margin: 10px 0 4px; font-size: 0.72rem; font-weight: 650; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted);
    }
    .passage { border-top: 1px solid var(--line); padding: 2px 0; }
    .passage-toggle { display: block; width: 100%; color: var(--text); line-height: 1.35; padding: 8px 0; }
    .passage-body { padding: 0 0 10px; color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
    .passage-body p { margin: 0 0 8px; color: var(--text); }
    .passage-body a { color: var(--focus); overflow-wrap: anywhere; }
    footer {
      flex-shrink: 0; padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
    }
    .composer {
      width: min(100%, var(--width)); margin: 0 auto; background: var(--elev);
      border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 12px;
    }
    .composer:focus-within { border-color: #5d7190; }
    textarea {
      display: block; width: 100%; min-height: 48px; max-height: 180px; resize: none;
      border: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px;
      line-height: 1.4; padding: 8px 4px;
    }
    .composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 0.75rem; padding-left: 4px; }
    .actions { display: flex; gap: 8px; margin-left: auto; }
    .send, .stop, .retry { border: 0; padding: 0 16px; font-weight: 650; }
    .send { background: #d7e3f8; color: #142033; }
    .send:disabled { opacity: 0.45; }
    .stop { background: #6e2e32; color: #fff; }
    .retry { background: #314155; color: #fff; }
    .error {
      display: none; width: min(100%, var(--width)); margin: 0 auto 8px;
      color: var(--danger); font-size: 0.88rem;
    }
    .error.active { display: block; }
    @media (max-width: 640px) {
      header { padding: 10px 12px; }
      .text-btn { padding: 0 12px; }
      .welcome h1 { font-size: 1.55rem; }
      .hint { display: none; }
      .msg.user .body { max-width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="name">Dharm</div>
      <div id="status" role="status" data-state="checking">Checking…</div>
    </div>
    <button type="button" class="text-btn" id="new-chat">New chat</button>
  </header>
  <main id="thread">
    <div class="column" id="column"></div>
  </main>
  <footer>
    <div id="error" class="error" role="alert"></div>
    <form class="composer" id="composer">
      <label class="sr-only" for="message-input">Message</label>
      <textarea id="message-input" rows="1" placeholder="Describe the decision…"></textarea>
      <div class="composer-foot">
        <div class="hint">Enter to send · Shift+Enter for a new line</div>
        <div class="actions">
          <button type="button" class="retry" id="retry-btn" hidden>Retry</button>
          <button type="button" class="stop" id="stop-btn" hidden>Stop</button>
          <button type="submit" class="send" id="send-btn">Send</button>
        </div>
      </div>
    </form>
  </footer>
  <script>
    const column = document.getElementById('column');
    const thread = document.getElementById('thread');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    const retryBtn = document.getElementById('retry-btn');
    const errorBox = document.getElementById('error');
    const statusEl = document.getElementById('status');

    let sessionId = crypto.randomUUID();
    let epoch = 0;
    let abortController = null;
    let generating = false;
    let pendingRetry = '';

    function paintWelcome() {
      column.innerHTML = '<div class="welcome"><h1>What decision are you weighing?</h1><p>Dharm draws on the Vedas, Upanishads, Bhagavad Gita, and Chanakya tradition.</p></div>';
    }
    paintWelcome();

    function setStatus(state) {
      const labels = { live: 'Ready', down: 'Unavailable' };
      statusEl.dataset.state = state;
      statusEl.textContent = labels[state] || 'Unavailable';
    }

    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        if (!res.ok) throw new Error('unavailable');
        const data = await res.json();
        if (!data.ready) throw new Error('unavailable');
        setStatus('live');
      } catch (err) {
        setStatus('down');
        const note = column.querySelector('.welcome p');
        if (note) note.textContent = 'The decision service is not connected, so Dharm cannot answer yet.';
      }
    }
    checkHealth();

    function resizeInput() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    }
    input.addEventListener('input', resizeInput);

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('active');
      retryBtn.hidden = !pendingRetry;
    }
    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('active');
      retryBtn.hidden = true;
    }
    function syncButtons() {
      sendBtn.disabled = generating;
      sendBtn.hidden = generating;
      stopBtn.hidden = !generating;
    }

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }
    function inline(value) {
      return value
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,;:])/g, '$1<em>$2</em>');
    }
    function renderMarkdown(source) {
      const lines = esc(source).split('\n');
      let html = '';
      let list = null;
      let para = [];
      let code = false;
      let codeLines = [];
      const closeList = () => {
        if (!list) return;
        html += list === 'ol' ? '</ol>' : '</ul>';
        list = null;
      };
      const closePara = () => {
        if (!para.length) return;
        html += '<p>' + para.map(inline).join('<br>') + '</p>';
        para = [];
      };
      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          if (code) {
            html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
            codeLines = [];
            code = false;
          } else {
            closePara();
            closeList();
            code = true;
          }
          continue;
        }
        if (code) { codeLines.push(line); continue; }
        const ul = line.match(/^\s*[-*]\s+(.*)/);
        const ol = line.match(/^\s*\d+\.\s+(.*)/);
        if (ul || ol) {
          closePara();
          const kind = ul ? 'ul' : 'ol';
          if (list !== kind) { closeList(); html += kind === 'ul' ? '<ul>' : '<ol>'; list = kind; }
          html += '<li>' + inline((ul || ol)[1]) + '</li>';
          continue;
        }
        if (!line.trim()) { closePara(); closeList(); continue; }
        closeList();
        para.push(line);
      }
      if (code) html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
      closePara();
      closeList();
      return html || '<p></p>';
    }

    function citedIds(text) {
      const ids = [];
      const re = /\[([A-Za-z]{1,4}\d{2,4})\]/g;
      let match;
      while ((match = re.exec(text || ''))) {
        const id = match[1].toUpperCase();
        if (!ids.includes(id)) ids.push(id);
      }
      return ids;
    }
    function safeUrl(url) {
      try {
        const parsed = new URL(url, window.location.origin);
        if (parsed.protocol === 'https:' || parsed.protocol === 'http:') return parsed.href;
      } catch (err) { /* ignore malformed links */ }
      return '';
    }
    function passageBlock(item) {
      const block = document.createElement('div');
      block.className = 'passage';
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'passage-toggle';
      button.setAttribute('aria-expanded', 'false');
      button.textContent = item.work + ' ' + item.locator;
      const body = document.createElement('div');
      body.className = 'passage-body';
      body.hidden = true;
      const translation = document.createElement('p');
      translation.textContent = item.translation || '';
      body.appendChild(translation);
      if (item.principle) {
        const principle = document.createElement('p');
        principle.textContent = item.principle;
        body.appendChild(principle);
      }
      const href = safeUrl(item.source_url || '');
      if (href) {
        const link = document.createElement('a');
        link.href = href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Source';
        body.appendChild(link);
      }
      button.addEventListener('click', () => {
        const open = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', open ? 'false' : 'true');
        body.hidden = open;
      });
      block.append(button, body);
      return block;
    }
    function renderSources(row, citations, citedList) {
      const previous = row.querySelector('.sources');
      if (previous) previous.remove();
      if (!citations || !citations.length) return;
      const cited = new Set((citedList || []).map((id) => String(id).toUpperCase()));
      const byId = new Map(citations.map((item) => [String(item.id).toUpperCase(), item]));
      const citedItems = [...cited].map((id) => byId.get(id)).filter(Boolean);
      const otherItems = citations.filter((item) => !cited.has(String(item.id).toUpperCase()));
      const wrap = document.createElement('div');
      wrap.className = 'sources';
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'sources-toggle';
      toggle.setAttribute('aria-expanded', 'false');
      const count = citedItems.length + otherItems.length;
      toggle.textContent = 'Sources (' + count + ')';
      const panel = document.createElement('div');
      panel.hidden = true;
      function group(title, items) {
        if (!items.length) return;
        const section = document.createElement('div');
        section.className = 'source-group';
        const heading = document.createElement('h3');
        heading.textContent = title;
        section.appendChild(heading);
        items.forEach((item) => section.appendChild(passageBlock(item)));
        panel.appendChild(section);
      }
      group('Cited in this answer', citedItems);
      group('Other retrieved passages', otherItems);
      toggle.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', open ? 'false' : 'true');
        panel.hidden = open;
      });
      wrap.append(toggle, panel);
      row.appendChild(wrap);
    }

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      const body = document.createElement('div');
      body.className = 'body';
      body.innerHTML = text ? renderMarkdown(text) : '<p class="pending">Thinking…</p>';
      row.appendChild(body);
      column.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return { row, body };
    }

    function startNewChat() {
      epoch += 1;
      if (abortController) abortController.abort();
      abortController = null;
      generating = false;
      pendingRetry = '';
      sessionId = crypto.randomUUID();
      syncButtons();
      clearError();
      paintWelcome();
      input.focus();
    }
    document.getElementById('new-chat').addEventListener('click', startNewChat);

    function stopGeneration() {
      if (abortController) abortController.abort();
    }
    stopBtn.addEventListener('click', stopGeneration);
    retryBtn.addEventListener('click', () => {
      if (!pendingRetry || generating) return;
      const failed = column.querySelector('.msg.assistant[data-failed="1"]');
      if (failed) failed.remove();
      const text = pendingRetry;
      clearError();
      sendMessage(text);
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });
    document.getElementById('composer').addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage();
    });

    async function sendMessage(resendText) {
      const text = (resendText || input.value).trim();
      if (!text || generating) return;
      const turn = epoch;
      const session = sessionId;
      const live = () => turn === epoch && session === sessionId;
      clearError();
      if (!resendText) {
        appendMessage('user', text);
        input.value = '';
        resizeInput();
      }
      pendingRetry = text;
      generating = true;
      syncButtons();
      abortController = new AbortController();
      const assistant = appendMessage('assistant', '');
      let answer = '';
      let metadata = null;
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: session }),
          signal: abortController.signal
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          if (response.status >= 500) setStatus('down');
          throw new Error(payload.detail || 'The reply did not complete.');
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop();
          for (const block of blocks) {
            if (!live()) return;
            let eventType = 'chunk';
            let data = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) eventType = line.slice(7).trim();
              else if (line.startsWith('data: ')) data += line.slice(6);
            }
            if (!data) continue;
            const payload = JSON.parse(data);
            if (eventType === 'metadata') metadata = payload;
            else if (eventType === 'chunk') {
              answer += payload.text || '';
              assistant.body.innerHTML = renderMarkdown(answer);
              thread.scrollTop = thread.scrollHeight;
            } else if (eventType === 'replace') {
              answer = payload.text || '';
              assistant.body.innerHTML = renderMarkdown(answer);
            } else if (eventType === 'error') {
              throw new Error(payload.error || 'The reply did not complete.');
            }
          }
        }
        if (!live()) return;
        if (metadata && metadata.session_id === session) renderSources(assistant.row, metadata.citations, metadata.cited_ids);
        pendingRetry = '';
        assistant.row.removeAttribute('data-failed');
      } catch (err) {
        if (!live()) return;
        if (err.name === 'AbortError') {
          const note = document.createElement('p');
          note.className = 'stopped';
          note.textContent = 'Stopped.';
          assistant.body.appendChild(note);
          pendingRetry = '';
        } else {
          assistant.row.dataset.failed = '1';
          assistant.body.innerHTML = '<p>' + esc(err.message || 'The reply did not complete.') + '</p>';
          showError('That message was not answered. Retry sends it again.');
        }
      } finally {
        if (live()) {
          generating = false;
          abortController = null;
          syncButtons();
        }
      }
    }
  </script>
</body>
</html>
